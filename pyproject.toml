[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slo-p"
version = "0.1.0"
description = "Historical SLO calibrator and Prometheus rules generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "ruamel.yaml>=0.18.0",
    "httpx>=0.27.0",
]

[project.scripts]
slop = "slop.cli:app"