# Example output generated by `slop gen example.yaml -d 7 -o rules.yaml`.
# Load this file in prometheus.yml under `rule_files:` (Prometheus / Thanos Ruler / Mimir).
groups:
  # One rule group is created per SLO entry.
  - name: slop_api_latency
    interval: 1m
    rules:
      # Evaluates the SLI every minute using PromQL's `bool` modifier (1 = good, 0 = bad).
      - record: slop:api_latency:sli_good
        expr: (histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))) < bool 0.09

      # Rolling error ratios over short and medium windows used by burn-rate alerts.
      - record: slop:api_latency:error_ratio5m
        expr: 1 - avg_over_time(slop:api_latency:sli_good[5m])
      - record: slop:api_latency:error_ratio30m
        expr: 1 - avg_over_time(slop:api_latency:sli_good[30m])
      - record: slop:api_latency:error_ratio1h
        expr: 1 - avg_over_time(slop:api_latency:sli_good[1h])
      - record: slop:api_latency:error_ratio6h
        expr: 1 - avg_over_time(slop:api_latency:sli_good[6h])

      # Rolling compliance over the configured window (`7d` or `30d`) and target line for dashboards.
      - record: slop:api_latency:compliance_7d
        expr: avg_over_time(slop:api_latency:sli_good[7d])
      - record: slop:api_latency:objective
        expr: vector(0.99)

      # Fast burn (page): fires when burning >14.4x the error budget across both 1h and 5m windows.
      - alert: ApiLatencyErrorBudgetBurnFast
        expr: |
          slop:api_latency:error_ratio1h > 0.144
          and
          slop:api_latency:error_ratio5m > 0.144
        for: 2m
        labels:
          severity: page
          slo: api-latency
        annotations:
          summary: Fast error budget burn on api-latency
          description: 'api-latency is burning error budget at >14.4x over 1h and 5m (objective: 0.99).'

      # Slow burn (ticket): fires when burning >6x the error budget across both 6h and 30m windows.
      - alert: ApiLatencyErrorBudgetBurnSlow
        expr: |
          slop:api_latency:error_ratio6h > 0.06
          and
          slop:api_latency:error_ratio30m > 0.06
        for: 15m
        labels:
          severity: ticket
          slo: api-latency
        annotations:
          summary: Slow error budget burn on api-latency
          description: 'api-latency is burning error budget at >6x over 6h and 30m (objective: 0.99).'
